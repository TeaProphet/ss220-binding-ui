name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SS220-Binding-Setup-${{ steps.version.outputs.value }}
          path: release/SS220-Binding-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = 'release/SS220-Binding-Setup-${{ steps.version.outputs.value }}.exe'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            gh release view $tag 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag $installer --title "SS220 Binding $tag" --generate-notes
            } else {
              gh release upload $tag $installer --clobber
            }
          } else {
            $tag = 'latest'
            $title = 'SS220 Binding — актуальная сборка'
            $notes = "Автоматическая сборка ветки master. Коммит: $env:GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --force $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag" --force
            gh release view $tag 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag $installer --title $title --notes $notes --latest
            } else {
              gh release upload $tag $installer --clobber
              gh release edit $tag --title $title --notes $notes --latest
            }
          }
