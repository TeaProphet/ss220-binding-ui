name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run browser tests
        run: npm run test:e2e

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SS220-Binding-Setup-${{ steps.version.outputs.value }}
          path: release/SS220-Binding-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $installer = 'release/SS220-Binding-Setup-${{ steps.version.outputs.value }}.exe'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer --title "SS220 Binding $tag" --generate-notes
          } else {
            gh release upload $tag $installer --clobber
          }
